<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <title>HOTEL PET - ENTRAR</title>
        <link rel="stylesheet" href="style-tela-login.css">
        <link rel="stylesheet" href="../style.css">
    </head>
    <body>
        <div class="tela-login">
            <div class="imagem-login">
                <img src="img/img-login.png" alt="Logo do Hotel Pet" class="logo-login">
            </div>
            <div class="formulario-login">
                <h1>Hotel Pet</h1>

                <form action="../tela_reservas/tela_reservas.html" method="get">
                    <input type="text" name="usuario" placeholder="Login" required>
                    <input type="password" name="senha" placeholder="Senha" required>
                    <div class="lembrar">
                        <input type="checkbox" name="Mantenha-me conectado" id="lembrar">
                        <label for="lembrar">Mantenha-me conectado</label>
                        <a href="#">Esqueceu a senha?</a>
                    </div>
                    <button type="submit">Entrar</button>
                </form>
                <div class="divisor">
                    <span>OU</span>
                </div>
                <div class="social-icons">
                    <img src="img/icons/Facebook.png" alt="facebook logo">
                    <img src="img/icons/twitter.png" alt="twitter logo">
                    <img src="img/icons/google.png" alt="google logo">
                </div>
                <a href="tela_criar_conta.html" class="link-criar-conta">Criar Conta</a>
            </div>  
        </div>
    </body>
</html>
