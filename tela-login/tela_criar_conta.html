<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <title>HOTEL PET - ENTRAR</title>
        <link rel="stylesheet" href="style-tela-login.css">
        <link rel="stylesheet" href="../style.css">
    </head>
    <body>
        <div class="tela-login">
            <div class="imagem-login">
                <img src="img/img-login.png" alt="Logo do Hotel Pet" class="logo-login">
            </div>
            <div class="formulario-login">
                <h1>Hotel Pet</h1>

                <form action="../tela_reservas/tela_reservas.html" method="get">
                    <input type="text" name="nome" placeholder="Nome" required>
                    <input type="text" name="sobrenome" placeholder="Sobrenome" required>
                    <input type="text" name="usuario" placeholder="Criar login" required>
                    <input type="password" name="senha" placeholder="Senha" required>
                    <input type="password" name="senha" placeholder="Confirmar senha" required>
                    <button type="submit">Criar conta</button>
                </form>
                
                <a href="tela_login.html" class="link-criar-conta">Já possui uma conta? login</a>
            </div>  
        </div>
    </body>
</html>
